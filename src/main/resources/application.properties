spring.application.name=exporter

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:54321/company_export
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.hikari.maximum-pool-size=12

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml



mybatis.mapper-locations=classpath:mapper/CompanyMapper.xml
mybatis.type-aliases-package=com.internship.exporter
mybatis.configuration.default-executor-type=BATCH


# Maximum file size per file
spring.servlet.multipart.max-file-size=250MB

# Maximum total request size
spring.servlet.multipart.max-request-size=300MB
spring.servlet.multipart.enabled=true

spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

server.address=0.0.0.0
